<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MyWhisper demo frame</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 960px; height: 600px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #3a4a6b 0%, #6b5b8a 55%, #b0798a 100%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  /* menu bar */
  #menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 26px;
    background: rgba(245, 245, 247, 0.78);
    display: flex; align-items: center; padding: 0 14px;
    font-size: 13px; color: #1d1d1f; gap: 18px;
  }
  #menubar .app { font-weight: 700; }
  #menubar .spacer { flex: 1; }
  #icon { width: 22px; height: 18px; border-radius: 4px; display: flex;
          align-items: center; justify-content: center; }
  #clock { font-variant-numeric: tabular-nums; }
  /* editor window */
  #win {
    position: absolute; left: 110px; top: 64px; width: 620px; height: 310px;
    background: #fff; border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35), 0 0 0 0.5px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  #titlebar { height: 36px; background: #ececec; border-bottom: 1px solid #d6d6d6;
              display: flex; align-items: center; padding: 0 12px; position: relative; }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
  #title { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px;
           font-weight: 600; color: #4d4d4d; pointer-events: none; }
  #doc { padding: 22px 26px; font-size: 17px; line-height: 1.5; color: #1d1d1f; }
  #caret { display: inline-block; width: 2px; height: 20px; background: #0a64d6;
           vertical-align: -4px; margin-left: 1px; }
  /* recording pill (RecordingPill.swift: 480 wide, radius 12, 16/12 padding, bottom-center) */
  #pill {
    position: absolute; left: 240px; width: 480px; bottom: 44px;
    background: rgba(28, 28, 30, 0.86); border-radius: 12px;
    padding: 12px 16px; color: rgba(255,255,255,0.92);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  #row { display: flex; align-items: center; height: 30px; }
  #meter { width: 28px; height: 18px; display: flex; align-items: center;
           justify-content: space-between; margin-right: 12px; }
  #meter i { display: block; width: 3px; border-radius: 1.5px; background: rgba(255,255,255,0.9); }
  #labels { flex: 1; }
  #elapsed { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 15px; }
  #caption { font-size: 11px; color: rgba(255,255,255,0.6); line-height: 13px; }
  #cancel { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,0.35);
            color: #2a2a2c; font-size: 12px; font-weight: 700; display: flex;
            align-items: center; justify-content: center; }
  #text { font-size: 15px; font-weight: 500; line-height: 20px; margin-top: 6px; min-height: 0; }
  #label { position: absolute; right: 14px; bottom: 10px; font-size: 11px;
           color: rgba(255,255,255,0.55); letter-spacing: 0.2px; }
  /* key hint */
  #key {
    position: absolute; right: 36px; top: 46px;
    background: rgba(28,28,30,0.82); color: #fff; border-radius: 10px;
    padding: 8px 14px; font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
    display: flex; gap: 8px; align-items: center;
  }
  #key kbd { font-family: inherit; background: rgba(255,255,255,0.16); border-radius: 6px;
             padding: 3px 9px; border: 1px solid rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <div id="menubar">
    <span class="app">Editor</span><span>File</span><span>Edit</span><span>Format</span><span>View</span>
    <span class="spacer"></span>
    <span id="icon"></span>
    <span id="clock">Thu 25 Sep&nbsp;&nbsp;9:41</span>
  </div>

  <div id="win">
    <div id="titlebar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <div id="title">Untitled</div>
    </div>
    <div id="doc"><span id="doctext"></span><span id="caret"></span></div>
  </div>

  <div id="label">Illustration</div>
  <div id="key"><kbd>⌥</kbd><kbd>Space</kbd></div>

  <div id="pill">
    <div id="row">
      <div id="meter"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="labels"><div id="elapsed">0:00</div><div id="caption">Mixed (Indonesian + English)</div></div>
      <div id="cancel">✕</div>
    </div>
    <div id="text"></div>
  </div>

<script>
// Frame is a pure function of t (seconds). render(t) is called per frame by
// the capture script; opening the page directly shows #t=<seconds>.
function render(t) {

const FINAL = "Tolong follow up client besok soal timeline sama budget approval, ya.";
// Live-preview updates, as the partial transcript grows while speaking.
const PREVIEWS = [
  [1.9, "Tolong follow up"],
  [2.6, "Tolong follow up client besok"],
  [3.3, "Tolong follow up client besok soal timeline"],
  [4.0, "Tolong follow up client besok soal timeline sama budget approval"],
  [4.6, FINAL],
];
const REC_START = 1.0, REC_END = 5.2, TRANSCRIBE_END = 5.6;

function rand(i, f) { // deterministic noise in [0,1)
  const x = Math.sin(i * 127.1 + f * 311.7) * 43758.5453;
  return x - Math.floor(x);
}
const frame = Math.round(t * 12);

// Menu bar icon (MenuBarIcon.swift): 5 bars, 2.2 wide, 1.5 gap, max 13 tall.
function iconSVG(heights, color, alpha) {
  const bw = 2.2, gap = 1.5, total = 5 * bw + 4 * gap;
  let x = (18 - total) / 2, bars = "";
  for (const h of heights) {
    const bh = Math.max(3, 13 * h), y = (18 - bh) / 2;
    bars += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw}" height="${bh.toFixed(2)}" rx="1.1"/>`;
    x += bw + gap;
  }
  return `<svg width="18" height="18" viewBox="0 0 18 18" fill="${color}" fill-opacity="${alpha}">${bars}</svg>`;
}

const recording = t >= REC_START && t < REC_END;
const transcribing = t >= REC_END && t < TRANSCRIBE_END;
const speaking = t >= 1.3 && t < 4.8;
const level = speaking ? 0.45 + 0.55 * rand(99, frame) : 0.08;

let icon;
if (recording) {
  const base = [0.45, 0.75, 1.0, 0.65, 0.5], energy = 0.25 + level * 0.75;
  icon = iconSVG(base.map((b, i) => Math.min(1, b * energy * (0.8 + 0.4 * rand(i, frame)))), "#ff3b30", 1);
} else if (transcribing) {
  icon = iconSVG([0.5, 0.5, 0.5, 0.5, 0.5], "#ff9500", frame % 4 < 2 ? 0.9 : 0.4);
} else {
  icon = iconSVG([0.35, 0.7, 1.0, 0.55, 0.3], "#1d1d1f", 1);
}
document.getElementById("icon").innerHTML = icon;

// Pill: fades in at recording start, out when recording stops.
const pill = document.getElementById("pill");
const pillIn = Math.min(1, Math.max(0, (t - REC_START) / 0.15));
const pillOut = Math.min(1, Math.max(0, (REC_END + 0.15 - t) / 0.15));
pill.style.opacity = recording || (t >= REC_END && t < REC_END + 0.15) ? Math.min(pillIn, pillOut) : 0;

document.querySelectorAll("#meter i").forEach((el, i) => {
  const base = [0.45, 0.75, 1.0, 0.65, 0.5][i];
  const h = Math.max(3, 18 * Math.min(1, base * (0.25 + level * 0.75) * (0.8 + 0.4 * rand(i + 7, frame))));
  el.style.height = h.toFixed(1) + "px";
});
document.getElementById("elapsed").textContent = "0:0" + Math.max(0, Math.floor(t - REC_START));
let preview = "";
for (const [at, s] of PREVIEWS) if (t >= at) preview = s;
const textEl = document.getElementById("text");
textEl.textContent = preview;
textEl.style.display = preview ? "block" : "none";

// Hotkey hint: shown around each ⌥Space tap.
const key = document.getElementById("key");
key.style.opacity = (t >= 0.55 && t < 1.25) || (t >= 4.85 && t < 5.5) ? 1 : 0;

// Pasted result in the editor after transcription finishes.
document.getElementById("doctext").textContent = t >= TRANSCRIBE_END ? FINAL : "";
const caret = document.getElementById("caret");
caret.style.opacity = recording || transcribing || Math.floor(t * 2) % 2 === 0 ? 1 : 0;
}
render(parseFloat((location.hash.match(/t=([\d.]+)/) || [0, "0"])[1]));
</script>
</body>
</html>
